<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="25" y="34" font-size="20" font-weight="600" fill="#222">Analysis chain of the bimaterial weld</text>
  <text x="25" y="56" font-size="13" fill="#666">Sequentially coupled: the stress run reads the temperatures of the thermal run, increment by increment</text>

  <!-- boxes -->
  <g stroke-width="1.6">
    <rect x="25"  y="80" width="170" height="300" rx="10" fill="#f4f4f4" stroke="#777"/>
    <rect x="215" y="80" width="170" height="300" rx="10" fill="#f4f4f4" stroke="#777"/>
    <rect x="405" y="80" width="190" height="300" rx="10" fill="#fff1e6" stroke="#c2410c"/>
    <rect x="615" y="80" width="190" height="300" rx="10" fill="#e8f2fa" stroke="#0369a1"/>
    <rect x="825" y="80" width="150" height="300" rx="10" fill="#f4f4f4" stroke="#777"/>
  </g>
  <g fill="#333">
    <line x1="195" y1="230" x2="213" y2="230" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="385" y1="230" x2="403" y2="230" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="595" y1="230" x2="613" y2="230" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="805" y1="230" x2="823" y2="230" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <g font-size="15" font-weight="600" text-anchor="middle">
    <text x="110" y="108" fill="#333">1. Geometry</text>
    <text x="300" y="108" fill="#333">2. Mesh</text>
    <text x="500" y="108" fill="#c2410c">3. Thermal</text>
    <text x="710" y="108" fill="#0369a1">4. Stress</text>
    <text x="900" y="108" fill="#333">5. Post</text>
  </g>
  <g font-size="12" fill="#333">
    <text x="37" y="136">axisymmetric sections</text>
    <text x="37" y="153">revolved (FreeCAD);</text>
    <text x="37" y="170">helical teeth cut in</text>
    <text x="37" y="196">5 named solids:</text>
    <text x="37" y="213">crown hex / tet,</text>
    <text x="37" y="230">carrier hex / tet,</text>
    <text x="37" y="247">filler</text>
    <text x="37" y="273">swept region already</text>
    <text x="37" y="290">partitioned, mesh</text>
    <text x="37" y="307">zones in the section</text>
    <text x="37" y="350" font-weight="600">bimaterial_assembly</text>
    <text x="37" y="366" font-weight="600">.step</text>

    <text x="227" y="136">quad mesh of the 2D</text>
    <text x="227" y="153">section, 3 zones,</text>
    <text x="227" y="170">revolved 600 x 0.6 deg</text>
    <text x="227" y="196">785 400 hex DC3D8 /</text>
    <text x="227" y="213">C3D8, filler conformal</text>
    <text x="227" y="239">581 520 tets DC3D10 /</text>
    <text x="227" y="256">C3D10M away from it,</text>
    <text x="227" y="273">*TIE to the hex region</text>
    <text x="227" y="299">1.72 M nodes</text>
    <text x="227" y="350" font-weight="600">mesh_nodes / elements</text>
    <text x="227" y="366" font-weight="600">/ sets (not in the repo)</text>

    <text x="417" y="136">DFLUX double cone,</text>
    <text x="417" y="153">4 kW, 1.5 m/min</text>
    <text x="417" y="170">dt = 0.0230 s = 0.6 deg:</text>
    <text x="417" y="187">beam on a node at every</text>
    <text x="417" y="204">increment end</text>
    <text x="417" y="230">phases + RLS on the hex;</text>
    <text x="417" y="247">plain cards on the tets</text>
    <text x="417" y="264">(they stay below Ac1)</text>
    <text x="417" y="290">UNSYMM=YES, 750 weld</text>
    <text x="417" y="307">increments + cooling</text>
    <text x="417" y="350" font-weight="600">.fil: NT every increment</text>
    <text x="417" y="366" font-weight="600">.odb: frames every 3 deg</text>

    <text x="627" y="136">press fit: 0.07 mm on the</text>
    <text x="627" y="153">diameter (*CLEARANCE,</text>
    <text x="627" y="170">SHRINK, small sliding),</text>
    <text x="627" y="187">saved once (*RESTART)</text>
    <text x="627" y="213">weld and cooling restart</text>
    <text x="627" y="230">from it, *TEMPERATURE</text>
    <text x="627" y="247">read from the .fil at the</text>
    <text x="627" y="264">thermal dt; phases and</text>
    <text x="627" y="281">transformation strains</text>
    <text x="627" y="298">recomputed</text>
    <text x="627" y="350" font-weight="600">residual stress,</text>
    <text x="627" y="366" font-weight="600">distortion (in work)</text>

    <text x="837" y="136">VTK frames</text>
    <text x="837" y="162">fusion section</text>
    <text x="837" y="179">(projection of the</text>
    <text x="837" y="196">pool along the travel)</text>
    <text x="837" y="222">expected</text>
    <text x="837" y="239">macrograph</text>
    <text x="837" y="265">hardness from the</text>
    <text x="837" y="282">phase fractions</text>
    <text x="837" y="350" font-weight="600">GIF, sections,</text>
    <text x="837" y="366" font-weight="600">comparisons</text>
  </g>
  <text x="25" y="415" font-size="12.5" fill="#333">Abaqus/Standard 2025x, 32 cores per job. Units: mm, s, tonne, mJ, MPa, C.</text>
  <text x="25" y="435" font-size="12.5" fill="#333">Filler: element activation (EA) or raw wire in the RLS state (RLS), see section 5. Same mesh, sets and heat source in both.</text>
</svg>
